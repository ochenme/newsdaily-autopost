name: check-setup

# Manual health check: verifies each secret works WITHOUT posting anything.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          PEXELS: ${{ secrets.PEXELS_API_KEY }}
          IG: ${{ secrets.IG_ACCESS_TOKEN }}
          TH: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GHP: ${{ secrets.GH_PAT }}
        run: |
          ok=1
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: $PEXELS" "https://api.pexels.com/v1/search?query=night&per_page=1")
          echo "PEXELS_API_KEY: HTTP $code"; [ "$code" = 200 ] || ok=0
          r=$(curl -s "https://graph.instagram.com/v23.0/me?fields=user_id,username,account_type&access_token=$IG")
          echo "IG_ACCESS_TOKEN: $(echo "$r" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("username"),d.get("account_type"),d.get("error",{}).get("message",""))')"
          echo "$r" | grep -q '"username"' || ok=0
          r=$(curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$TH")
          echo "THREADS_ACCESS_TOKEN: $(echo "$r" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("username"),d.get("error",{}).get("message",""))')"
          echo "$r" | grep -q '"username"' || ok=0
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GHP" "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")
          echo "GH_PAT (secrets access): HTTP $code"; [ "$code" = 200 ] || ok=0
          [ $ok = 1 ] && echo "ALL OK" || { echo "SOME CHECKS FAILED"; exit 1; }
