name: check-setup

# Verifies each secret works WITHOUT posting anything.
# Runs manually, or when .github/check-trigger changes. Writes a non-secret summary to data/setup-check.txt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/check-trigger"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          PEXELS: ${{ secrets.PEXELS_API_KEY }}
          IG: ${{ secrets.IG_ACCESS_TOKEN }}
          TH: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GHP: ${{ secrets.GH_PAT }}
        run: |
          out=data/setup-check.txt; mkdir -p data
          echo "checked_at: $(TZ=Asia/Taipei date '+%F %T')" > $out
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: $PEXELS" "https://api.pexels.com/v1/search?query=night&per_page=1")
          echo "PEXELS_API_KEY: HTTP $code" >> $out
          r=$(curl -s "https://graph.instagram.com/v23.0/me?fields=user_id,username,account_type&access_token=$IG")
          echo "IG_ACCESS_TOKEN: $(echo "$r" | python3 -c 'import sys,json;d=json.load(sys.stdin);e=d.get("error",{});print("OK @"+str(d.get("username"))+" type="+str(d.get("account_type")) if "username" in d else "ERROR "+str(e.get("code"))+" "+str(e.get("message")))')" >> $out
          r=$(curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=$TH")
          echo "THREADS_ACCESS_TOKEN: $(echo "$r" | python3 -c 'import sys,json;d=json.load(sys.stdin);e=d.get("error",{});print("OK @"+str(d.get("username")) if "username" in d else "ERROR "+str(e.get("code"))+" "+str(e.get("message")))')" >> $out
          if [ -n "$GHP" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GHP" "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")
            echo "GH_PAT: HTTP $code" >> $out
          else
            echo "GH_PAT: missing" >> $out
          fi
          cat $out
      - name: Save summary
        run: |
          git config user.name "newsdaily-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/setup-check.txt && git commit -m "setup check" && git push || true
